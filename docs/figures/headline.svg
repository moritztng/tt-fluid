<line x1="800.0" y1="80" x2="800.0" y2="240" stroke="var(--t3)" stroke-width="1.5"/>
<text class="ax" x="804.0" y="92">OpenFOAM</text>
<text class="l" x="690" y="118" text-anchor="end">tt-fluid, 9 runs</text>
<circle cx="743.0" cy="114" r="5" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="824.1" cy="114" r="5" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="789.1" cy="114" r="5" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="787.3" cy="114" r="5" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="755.4" cy="114" r="5" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="814.3" cy="114" r="5" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="817.4" cy="114" r="5" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="774.7" cy="114" r="5" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="804.6" cy="114" r="5" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/>
<text class="v" x="912" y="118">-22.8 to +9.7</text>
<text class="l" x="690" y="164" text-anchor="end">8x H100, 8 runs</text>
<circle cx="867.6" cy="160" r="5" fill="var(--c2)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="809.4" cy="160" r="5" fill="var(--c2)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="831.9" cy="160" r="5" fill="var(--c2)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="811.2" cy="160" r="5" fill="var(--c2)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="768.6" cy="160" r="5" fill="var(--c2)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="810.2" cy="160" r="5" fill="var(--c2)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="826.8" cy="160" r="5" fill="var(--c2)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="837.8" cy="160" r="5" fill="var(--c2)" stroke="var(--bg)" stroke-width="2"/>
<text class="v" x="912" y="164">-12.6 to +27.0</text>
<text class="l" x="690" y="210" text-anchor="end">B200</text>
<circle cx="825.1" cy="206" r="5" fill="var(--c2)" stroke="var(--bg)" stroke-width="2"/>
<text class="v" x="912" y="210">+10.0</text>
<text class="ax" x="540" y="346">bench/cdgrade.py on results/; 0 is OpenFOAM's long-run mean, same start.</text>
<text class="ax" x="540" y="362">Shaded: +-17.8 counts, the band for one run (12.5 for four or more pooled).</text>
</g></svg>
